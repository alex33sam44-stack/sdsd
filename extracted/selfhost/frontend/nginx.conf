server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # Hashed JS bundles must not be rewritten (sub_filter will scan them
  # otherwise on disk-cached responses).
  location ~* \.(?:js|css|map|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location / {
    # Inject the i18n runtime overlay BEFORE the SPA bundle. This is the
    # mechanism that translates DOM text after the FROZEN frontend has
    # rendered. The script is tiny (<6KB) and served by the backend at
    # /api/i18n/runtime.js so it can read locale + dictionary from the
    # same origin without CORS.
    sub_filter '<head>' '<head><script src="/api/i18n/runtime.js" defer></script>';
    sub_filter_once on;
    sub_filter_types text/html;

    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }
}
