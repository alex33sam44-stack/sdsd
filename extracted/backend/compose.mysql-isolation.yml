services:
  mysql-tenant-isolation:
    image: mysql:8.4
    container_name: mwasalat_mysql_tenant_isolation
    environment:
      MYSQL_ROOT_PASSWORD: tenant_isolation_root
      MYSQL_DATABASE: mwasalat_tenant_isolation
      MYSQL_USER: tenant_isolation
      MYSQL_PASSWORD: tenant_isolation_password
    ports:
      - "${MYSQL_TENANT_ISOLATION_PORT:-33306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql
